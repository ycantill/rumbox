name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Playwright contra la app compilada y un Supabase local real (Postgres con
    # todas las migraciones de supabase/migrations), sin tocar la base de producción.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Supabase local (aplica las migraciones)
        run: npm run db:start
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E (flujo, límites, accesibilidad WCAG 2.2 AA, 360 px)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
